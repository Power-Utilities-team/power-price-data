name: Refresh ENTSO-E power-price data

# Keeps the published CSVs current with NO human trigger, so a non-technical
# person just opens the Excel workbook (set to refresh-on-open) and gets fresh
# data. Also runnable on demand from the Actions tab ("Run workflow").
on:
  schedule:
    # 07:23 UTC on the 2nd. Three deliberate choices, all measured:
    #
    #  * the 2nd, not the 1st or the 3rd (Fred's call, 2026-08-01). What sets the floor
    #    is not the publication lag but the MONTH GATE: a month counts complete only
    #    once coverage passes its final hour, so July needs coverage_end >= 1 Aug 00:00.
    #    Coverage trails the run by ~1h34m (measured 2026-07-30; corroborated by the
    #    2026-07-31 17:29 run, whose coverage ended 16:00). That gives, for a late
    #    ENTSO-E publication:
    #
    #        1st  07:23 ->  7h23m of allowance   (~5h49m over the normal lag)
    #        2nd  07:23 -> 31h23m
    #        3rd  07:23 -> 55h23m
    #
    #    The 1st was rejected on the FAILURE MODE, not the odds. Exceeding the
    #    allowance does not fail the run: it succeeds, publishes, and silently omits the
    #    month from every monthly exhibit until the next scheduled run a month later.
    #    The shrink guard cannot see that — a month that never arrives is not a shrink —
    #    which is why check_coverage.check_month_arrived now asserts it directly. The
    #    2nd keeps a day in hand and still lands the month a day earlier than the 3rd.
    #    There is no weekend gap to worry about either way (weekend/weekday row ratio
    #    0.998; European power markets clear every day).
    #
    #  * :23, not :00 — GitHub queues scheduled workflows on shared runners and delays
    #    them under load, and load spikes hardest on the hour. An odd minute avoids the
    #    worst of the queue.
    #
    #  * WEEKLY as well as monthly (Fred's call, 2026-08-03), replacing the monthly-only
    #    schedule. The monthly line is still the one that catches the just-closed month
    #    on the 2nd, for all the reasons above; the weekly line exists to keep the repo
    #    active and to shorten the recovery time when something goes wrong.
    #
    #    The audit that justified monthly-only (2026-07-30) still stands on its own
    #    terms: no chart gains a data point mid-month, so weekly buys no new data. What
    #    it buys is FAILURE RECOVERY, which that audit did not weigh. Under monthly-only
    #    a red run left the published data untouched for a further 30 days; weekly heals
    #    the same failure in 7. That matters far more during a long unattended period
    #    than chart granularity does.
    - cron: "23 7 * * 1"      # every Monday 07:23 UTC — freshness + keeps the repo active
    - cron: "23 7 2 * *"      # and the 2nd, which is what actually lands the closed month
    #
    # ⚠ GitHub disables scheduled workflows after 60 days with no repository activity,
    # and this is the reason for the weekly line above. The arithmetic on monthly-only
    # was worse than the old comment here claimed: it said two consecutive failures were
    # needed, but ONE was enough — a failed run on the 2nd left no commit until the 2nd
    # of the following month, which is 61 days, so the schedule would have been disabled
    # the day before the run that would have healed it. Worse, commits pushed by the
    # Actions bot with GITHUB_TOKEN are widely reported not to reset the clock at all.
    # A weekly cadence puts the question beyond reach either way.
    # If the Status tab ever shows STALE, check the Actions tab for a disabled schedule.
  workflow_dispatch:
    inputs:
      full_refetch:
        description: "Re-pull the whole year from ENTSO-E (slow, ~20 min). Leave off for the fast incremental refresh."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Serialise runs. Two overlapping runs on 2026-07-31 raced: the first pushed while the
  # second was still fetching, and the second then failed trying to reconcile. The commit
  # step is now conflict-proof on its own, but queueing also stops two 25-minute jobs
  # burning in parallel to produce the same files.
  group: refresh
  cancel-in-progress: false

jobs:
  # ---- 1) fetch each country in parallel (keeps wall-clock ~40 min) ----------
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 100          # DE 15-min data is slow on GitHub's 2-core runners (~60-65 min)
    strategy:
      fail-fast: false
      matrix:
        country: [DE, ES, PT, FR, IT]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      # Persist THIS year's raw between runs so the fetch can be incremental. ~16 MB per
      # country-set. The cache is an OPTIMISATION, never a correctness dependency: on a
      # miss, data/raw is empty, fetch.py finds nothing stored and pulls the whole year,
      # which is exactly the old behaviour. So the fast path can never leave worse data
      # than the slow one — only take longer when cold.
      #
      # GitHub evicts a cache after ~7 days unused, so cadence decides how thorough each
      # run is, with no configuration and nothing to remember: infrequent = cold = a full
      # re-pull, frequent = warm = a couple of minutes.
      #
      # ⚠ CHANGED by the move to weekly (2026-08-03). Under the old monthly-only schedule
      # every run found the cache cold and re-pulled the whole year, so each run was
      # maximally self-correcting BY ACCIDENT. Weekly runs sit inside the ~7-day eviction
      # window and will often find it warm, so they are genuinely incremental.
      #
      # That is still correct on its own terms — the 30-day trailing window comfortably
      # covers a 7-day gap, and data older than 30 days does not move. But it would have
      # silently dropped the self-repair, so the fetch step below now forces a full
      # whole-year re-pull on the 2nd of each month. The behaviour is unchanged from the
      # monthly-only era; it is just deliberate now rather than a side-effect of cache
      # timing. Weekly = fast and incremental, monthly = slow and authoritative.
      - name: Restore cached raw data
        id: rawcache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ matrix.country }}-${{ github.run_id }}
          restore-keys: |
            raw-${{ matrix.country }}-

      - name: Fetch ${{ matrix.country }} (current year, plus the prior year at rollover)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        working-directory: _tools
        run: |
          YEAR=$(python -c "from datetime import date; print(date.today().year)")
          # The frozen history normally ends at YEAR-1. In January it still ends at
          # YEAR-2, so the just-completed year has to be fetched too or it is lost
          # entirely (it is in neither the history nor the current-year pull).
          NEED_PRIOR=$(python -c "
          import build_hourly as b, config as c
          end = b.frozen_history_end()
          print(1 if end is not None and end < c.CURRENT_YEAR - 1 else 0)")
          if [ "$NEED_PRIOR" = "1" ]; then
            PRIOR=$((YEAR-1))
            echo "rollover detected — fetching ${{ matrix.country }} $PRIOR as well"
            python fetch.py --country ${{ matrix.country }} --years $PRIOR --force
            python fetch.py --country ${{ matrix.country }} --years $PRIOR
          fi
          # Incremental by default. A 30-day trailing window catches both ENTSO-E's
          # revisions to already-published data and any hour a 503 left empty; measured
          # 2026-07-31, there were ZERO gaps inside the covered span across 2024, 2025
          # and 2026, so the in-run second pass already handles transient failures.
          # `full_refetch` forces the old whole-year pull when belt-and-braces is wanted,
          # and the annual rollover above always re-pulls the prior year in full.
          #
          # ONCE A MONTH, ALWAYS RE-PULL THE WHOLE YEAR (added 2026-08-03).
          # Under the old monthly-only schedule this happened by accident: 30 days
          # between runs is longer than GitHub's ~7-day cache eviction, so the cache was
          # always cold and every run rebuilt the year from ENTSO-E. That was a free
          # self-repair — any stored raw file that had gone bad was simply replaced.
          # Weekly runs sit inside the eviction window and would keep the cache warm, so
          # that repair would have quietly disappeared. Making the run on the 2nd always
          # re-fetch in full restores it deliberately, instead of relying on a cache
          # timing coincidence nobody would think to preserve.
          DOM=$(date -u +%d)
          if [ "${{ inputs.full_refetch }}" = "true" ] || [ "$DOM" = "02" ]; then
            echo "FULL re-fetch of ${{ matrix.country }} $YEAR (requested, or monthly rebuild on day $DOM)"
            python fetch.py --country ${{ matrix.country }} --years $YEAR --force
            python fetch.py --country ${{ matrix.country }} --years $YEAR
          else
            echo "incremental refresh of ${{ matrix.country }} $YEAR (30-day window)"
            python fetch.py --country ${{ matrix.country }} --years $YEAR --since-days 30
            python fetch.py --country ${{ matrix.country }} --years $YEAR --since-days 30   # 2nd pass fills 503 gaps
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: raw-${{ matrix.country }}
          path: data/raw/
          retention-days: 1

  # ---- 2) assemble, summarise, publish --------------------------------------
  build:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Download all raw data
        uses: actions/download-artifact@v4
        with:
          path: _dl
      - name: Merge raw artifacts into data/raw
        run: |
          mkdir -p data/raw
          find _dl -name '*.parquet' -exec cp {} data/raw/ \;
          echo "raw files: $(ls data/raw | wc -l)"
      - name: Build + summarise + export
        working-directory: _tools
        run: |
          # At the January rollover, fold the completed year into the frozen history
          # first — otherwise the incremental build below silently loses that year.
          # No-op in every other month.
          python build_hourly.py --absorb-prior-year
          python build_hourly.py
          python summaries.py
          python export_csv.py          # tidy/long CSVs
          python chart_csv.py           # chart-ready wide CSVs (what Excel loads)
          python extra_summaries.py     # G1/G2/G3 hourly-granularity tables
          python build_status.py        # status.csv -> the staleness banner in Excel

      - name: Publish CSVs to /published
        run: |
          mkdir -p published/charts
          cp outputs/csv/*.csv outputs/csv/manifest.json published/
          cp outputs/csv/charts/*.csv published/charts/
          echo "Last refreshed: $(date -u +'%Y-%m-%d %H:%M UTC')" > published/LAST_REFRESH.txt

      - name: Install Arial-compatible fonts for the chart render
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation
          fc-list | grep -ci "liberation sans" || (echo "font missing" && exit 1)

      - name: Rebuild the deliverables (workbook + decks)
        working-directory: _tools
        run: |
          # This is what removes the last manual step. Charts carry one series per
          # year, so a newly completed year only appears via a rebuild — running
          # generate.py here means that happens by itself, on any machine, forever.
          python generate.py
          python check_consistency.py

      - name: Stage the rebuilt deliverables
        run: |
          mkdir -p deliverables
          cp outputs/HourlyPowerData.xlsx outputs/HourlyPowerData.pptx \
             outputs/HourlyPowerData_frozen.xlsx outputs/HourlyPowerData_snapshot.pptx \
             deliverables/
          ls -la deliverables/

      # NOTHING is committed by this job. Everything it produced is handed on as an
      # artifact and committed by `publish` below, only once the Windows validator and
      # the coverage guard have both passed. Until 2026-07-31 this job committed first
      # and validated afterwards, so an invalid package landed in the repo and only
      # THEN turned the run red — which is exactly how a workbook that made Excel offer
      # to Recover reached deliverables/.
      - name: Stage the data to publish
        run: |
          mkdir -p payload/data/processed
          cp -r published payload/published
          cp -r deliverables payload/deliverables
          cp data/processed/master_fixed.parquet data/processed/capacity_fixed.parquet \
             payload/data/processed/
          du -sh payload
      - uses: actions/upload-artifact@v4
        with:
          name: publish-payload
          path: payload/
          retention-days: 1

  # ---- 3) validate the built files with Microsoft's OWN schema validator -------
  # windows-latest is free and unlimited on a public repo and ships .NET, so this costs
  # nothing. It matters because our own checks are hand-written: they encode the faults
  # we have already hit and nothing else. Twice on 2026-07-31 a workbook passed every
  # check we had and still made Excel offer to Recover (a missing [Content_Types]
  # override; a strCache declaring points it did not hold). Both are schema violations,
  # and this is the same definition Excel uses to decide.
  #
  # It CANNOT render anything — Microsoft does not licence Excel on hosted runners — so
  # this answers "is the package valid", never "does the chart look right".
  #
  # This job now GATES the publish rather than trailing it, so a package it rejects
  # never reaches the repository at all.
  validate:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: publish-payload
          path: payload
      - name: Install dotnet-script
        run: dotnet tool install -g dotnet-script
      - name: Validate every deliverable against the Open XML schema
        shell: pwsh
        run: |
          $files = Get-ChildItem payload/deliverables -Include *.xlsx,*.pptx -Recurse |
                   ForEach-Object { $_.FullName }
          Write-Host "validating $($files.Count) file(s)"
          if ($files.Count -lt 4) { throw "expected 4 deliverables, found $($files.Count)" }
          dotnet script _tools/validate_ooxml.csx -- @files

  # ---- 4) guard the data, then commit ----------------------------------------
  # The LAST job, and the only one that writes to the repository. It runs after every
  # check has passed, which is the whole point: nothing reaches main that the Open XML
  # validator or the coverage guard rejected.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v4
        with:
          name: publish-payload
          path: payload
      - name: Lay the built files over the checked-out repo
        run: |
          test -d payload/published && test -d payload/deliverables || {
            echo "publish-payload is not shaped as expected:"; find payload -maxdepth 2; exit 1; }
          mkdir -p published deliverables data/processed
          cp -r payload/published/. published/
          cp -r payload/deliverables/. deliverables/
          cp payload/data/processed/*.parquet data/processed/
          git status --short | head -40

      # THE COVERAGE GUARD. Everything else asks "is this data valid?"; this asks "is it
      # the data we already had, plus more?" On 2026-07-31 the answer was no and nothing
      # noticed: a cold cache made the incremental fetch publish a 31-day "year" in place
      # of 212 days, twice (commits d4bdc58 and 8db1093). The run was fast and green and
      # every validator passed — correctly, because a 31-day series is perfectly VALID
      # data. It is just the wrong data.
      #
      # Replayed over the repo's whole published history: silent on every ordinary
      # refresh, and it fires on exactly the commits that shipped or restored bad data.
      #
      # The baseline is origin/main rather than the checkout, because that is the state
      # this run is about to commit on top of — the same ref the reset below moves to.
      - name: Assert published coverage has not shrunk
        run: |
          git fetch origin main
          python _tools/check_coverage.py --baseline origin/main

      - name: Commit published data
        run: |
          git config user.name  "power-price-bot"
          git config user.email "actions@github.com"
          # master_fixed/capacity_fixed change only at the rollover, but they MUST be
          # committed when they do — they are the history every later run builds on.
          #
          # `git pull --rebase` was wrong here and failed for real on 2026-07-31: every
          # file this job commits is REGENERATED from scratch, so if another run pushed
          # in the meantime, rebasing replays our commit onto theirs and every single
          # CSV conflicts (different timestamps, same lines). `|| true` then swallowed
          # the error, leaving a detached HEAD, and the push died with exit 128 — so a
          # 25-minute build produced nothing and the fix it carried never shipped.
          #
          # There is nothing to merge: this run's output IS the newest complete state.
          # So move the branch pointer to origin and commit once on top of it. No
          # replay, so no conflict is possible.
          #
          # The reset is MIXED, not --soft, and that distinction is load-bearing. A soft
          # reset moves HEAD but leaves the INDEX holding the checkout, so `git commit`
          # writes back every file that changed on main during the run — reverting it
          # silently. That is not hypothetical: on 2026-07-31 commit 8db1093 deleted a
          # pending-updates.md row a human had added 30 minutes earlier, and the run went
          # green. A mixed reset rebuilds the index from origin, so `git add` below
          # stages OUR paths and nothing else can ride along.
          git fetch origin main
          git reset --mixed origin/main
          git add published deliverables data/processed/master_fixed.parquet data/processed/capacity_fixed.parquet
          # Anything staged that we did not name is a file this job must not touch.
          UNEXPECTED=$(git diff --staged --name-only |
                       grep -Ev '^(published/|deliverables/|data/processed/(master|capacity)_fixed\.parquet$)' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "refusing to commit files outside the publish set:"; echo "$UNEXPECTED"; exit 1
          fi
          if git diff --staged --quiet; then
            echo "no data changes"
          else
            git commit -m "data refresh $(date -u +'%Y-%m-%d')"
            git push origin HEAD:main
          fi
